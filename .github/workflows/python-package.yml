name: Rent591Watcher

on:
  schedule:
  # Active window 09:00-04:00 Taipei (UTC+8) = 01:00-20:00 UTC.
  # Runs 3x/hour at :07, :27, :47 -- deliberately NOT at :00. GitHub treats
  # scheduled workflows as best-effort and silently drops many runs under load,
  # with the top of the hour being the most contended/dropped slot. Checking
  # several times an hour at an offset minute means new listings still get
  # caught promptly even when some runs are skipped. (Public repo = free minutes.)
    - cron: "7,27,47 1-20 * * *"
  workflow_dispatch:
    inputs:
      mark_seen_only:
        description: "Silent catch-up: record current listings as seen without sending Discord alerts"
        type: boolean
        default: false

jobs:
  scrape-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          # URL holds one or more 591 searches (space/newline separated). We combine
          # the URL and URL2 repository secrets so both property-type searches run.
          URL: "${{ secrets.URL }} ${{ secrets.URL2 }}"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAX_PRICE: "30000"
          ALLOWED_KINDS: "整層住家,獨立套房"
          KEYWORDS: ""
          REQUIRE_ELEVATOR: "false"
          WANTED_PAGES: "2"
          SEND_EMPTY_STATUS: "false"
          # true only for a manual "silent catch-up" dispatch; empty on scheduled runs
          MARK_SEEN_ONLY: ${{ inputs.mark_seen_only }}
        run: python main.py

      - name: Commit seen listing ids
        run: |
          if [ -z "$(git status --porcelain -- seen_ids.json)" ]; then
            echo "No seen_ids.json changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json
          git commit -m "Update seen listing ids"
          git push
